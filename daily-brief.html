<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>The Daily Brief</title>
  <meta name="description" content="A personal digital newspaper on markets, deals, the Indian economy, trade, technology and climate finance.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..900;1,6..96,500..700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=Newsreader:ital,opsz,wght@0,6..72,400..700;1,6..72,400..600&display=swap">
  <style>
/* The Daily Brief — editorial stylesheet
   Layout concept: a 12-column broadsheet grid. Lead story spans 7 columns,
   the remaining front-page stories stack in a ranked rail; sections below
   run as three-column bands separated by heavy ink rules. */

:root {
  --paper: #f5f5f1;
  --surface: #eaebe5;
  --ink: #16191d;
  --ink-2: #4b5058;
  --ink-3: #6e737a;
  --rule: #c8cac3;
  --accent: #0e4a59;         /* petrol ink: links, kickers */
  --accent-soft: #dbe7e8;
  --demo: #a4501c;           /* demo / caution label */
  --demo-soft: #f4e4d6;
  --ok: #2c6b3f;
  --warn: #8a6a12;

  --f-display: "Bodoni Moda", "Didot", "Bodoni 72", Georgia, serif;
  --f-body: "Newsreader", "Iowan Old Style", "Charter", Georgia, serif;
  --f-label: "IBM Plex Sans Condensed", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;

  --step--1: 0.8125rem;
  --step-0: 1.0625rem;
  --step-1: 1.25rem;
  --step-2: 1.5rem;
  --step-3: 2rem;
  --step-4: clamp(2.1rem, 4.2vw, 3.1rem);
  --step-5: clamp(2.8rem, 8vw, 5.6rem);

  --gutter: clamp(16px, 3vw, 40px);
  --maxw: 1240px;
  --measure: 66ch;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #121416; --surface: #1b1e21; --ink: #e9e7e2; --ink-2: #b0b3b8; --ink-3: #8c9096;
    --rule: #30343a; --accent: #7fbccb; --accent-soft: #1d2f34; --demo: #e4a06a; --demo-soft: #3a2a1e;
    --ok: #7cc392; --warn: #d9b45a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #121416; --surface: #1b1e21; --ink: #e9e7e2; --ink-2: #b0b3b8; --ink-3: #8c9096;
  --rule: #30343a; --accent: #7fbccb; --accent-soft: #1d2f34; --demo: #e4a06a; --demo-soft: #3a2a1e;
  --ok: #7cc392; --warn: #d9b45a; color-scheme: dark;
}

*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--f-body);
  font-size: var(--step-0);
  line-height: 1.55;
  font-optical-sizing: auto;
}
a { color: inherit; text-decoration: none; }
a:hover { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 2px; }
img { max-width: 100%; }
h1, h2, h3, h4 { text-wrap: balance; margin: 0; }
p { margin: 0; }

.wrap { max-width: var(--maxw); margin-inline: auto; padding-inline: var(--gutter); }
.label {
  font-family: var(--f-label); font-size: var(--step--1); font-weight: 500;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-2);
}
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.skip { position: absolute; left: -999px; }
.skip:focus { left: 16px; top: 16px; background: var(--paper); padding: 8px 12px; z-index: 10; }

/* ---------- Masthead ---------- */
.masthead { padding-block: 18px 0; }
.dateline {
  display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 20px;
  border-bottom: 1px solid var(--rule); padding-bottom: 10px;
}
.dateline span { white-space: nowrap; }
.nameplate { text-align: center; padding-block: clamp(14px, 3vw, 28px) clamp(10px, 2vw, 18px); }
.nameplate a { display: inline-block; }
.nameplate h1 {
  font-family: var(--f-display); font-weight: 800; font-size: var(--step-5);
  line-height: 0.95; letter-spacing: -0.015em;
}
.nameplate h1 em { font-style: italic; font-weight: 500; }
.tagline { margin-top: 10px; font-style: italic; color: var(--ink-2); font-size: var(--step-0); }

.navbar {
  border-top: 3px double var(--ink); border-bottom: 1px solid var(--ink);
  display: flex; align-items: center; gap: 12px; padding-block: 6px;
}
.sections-nav { display: flex; gap: 2px 18px; flex-wrap: wrap; flex: 1; min-width: 0; }
.sections-nav a {
  font-family: var(--f-label); font-size: 0.9rem; font-weight: 500; padding-block: 6px; white-space: nowrap;
}
.sections-nav a[aria-current="page"] { color: var(--accent); box-shadow: inset 0 -2px 0 var(--accent); }
.search { display: flex; align-items: center; border: 1px solid var(--rule); background: var(--paper); }
.search input {
  border: 0; background: transparent; color: var(--ink); font: 0.95rem var(--f-label);
  padding: 7px 10px; width: 13rem; min-width: 0;
}
.search input:focus { outline: none; }
.search:focus-within { border-color: var(--accent); }
.search button {
  border: 0; background: var(--ink); color: var(--paper); font: 500 0.8rem var(--f-label);
  letter-spacing: 0.06em; text-transform: uppercase; padding: 8px 12px; cursor: pointer;
}
.theme-toggle {
  border: 1px solid var(--rule); background: transparent; color: var(--ink); cursor: pointer;
  font: 500 0.8rem var(--f-label); padding: 7px 9px; letter-spacing: 0.04em;
}

/* ---------- Notices & badges ---------- */
.notice {
  margin-top: 16px; padding: 10px 14px; background: var(--demo-soft); color: var(--ink);
  border-left: 4px solid var(--demo); font-family: var(--f-label); font-size: 0.95rem;
  display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline;
}
.notice strong { color: var(--demo); letter-spacing: 0.06em; text-transform: uppercase; font-size: 0.8rem; }
.badge {
  display: inline-flex; align-items: center; gap: 5px; font: 600 0.68rem var(--f-label);
  letter-spacing: 0.1em; text-transform: uppercase; padding: 2px 6px; border: 1px solid currentColor;
  white-space: nowrap; line-height: 1.4;
}
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge--demo { color: var(--demo); }
.badge--unverified { color: var(--warn); }
.badge--source-linked, .badge--evergreen { color: var(--accent); }
.badge--verified { color: var(--ok); }
.badge--corrected { color: var(--warn); }

/* ---------- Section frames ---------- */
main { padding-block: 8px 48px; }
.band { margin-top: 40px; }
.band__head {
  display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  border-top: 4px solid var(--ink); padding-top: 8px; margin-bottom: 18px;
}
.band__head h2 { font-family: var(--f-display); font-weight: 700; font-size: var(--step-3); line-height: 1.1; }
.band__head p { color: var(--ink-2); font-style: italic; font-size: 0.98rem; }
.band__head .more { font-family: var(--f-label); font-size: 0.9rem; color: var(--accent); white-space: nowrap; }
.band__title { display: grid; gap: 2px; min-width: 0; }

/* ---------- Article card (reusable component) ---------- */
.card { display: grid; gap: 8px; align-content: start; min-width: 0; }
.card__meta { display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
.card__kicker { font: 600 0.78rem var(--f-label); letter-spacing: 0.09em; text-transform: uppercase; color: var(--accent); }
.card__headline { font-family: var(--f-display); font-weight: 700; line-height: 1.15; font-size: var(--step-1); }
.card__headline a:hover { color: var(--accent); }
.card__summary { color: var(--ink-2); font-size: 0.98rem; line-height: 1.5; }
.card__why {
  font-size: 0.93rem; line-height: 1.45; border-top: 1px solid var(--rule); padding-top: 8px; color: var(--ink);
}
.card__why b { font: 600 0.72rem var(--f-label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--accent); margin-right: 6px; }
.card__foot {
  display: flex; flex-wrap: wrap; gap: 4px 12px; font-family: var(--f-label); font-size: 0.82rem; color: var(--ink-3);
}
.card__foot a { color: var(--ink-2); text-decoration: underline; text-decoration-color: var(--rule); text-underline-offset: 3px; }
.card__foot a:hover { color: var(--accent); }

.card--lead .card__headline { font-size: var(--step-4); line-height: 1.04; letter-spacing: -0.01em; }
.card--lead .card__summary { font-size: var(--step-1); line-height: 1.45; color: var(--ink); max-width: 60ch; }
.card--lead .card__dek { font-style: italic; color: var(--ink-2); font-size: var(--step-0); }
.card--lead .card__why { font-size: 1rem; max-width: 62ch; }
.card__opening { font-size: 1.02rem; line-height: 1.6; max-width: 62ch; }
.card__more { font: 500 0.9rem var(--f-label); color: var(--accent); }
.figures {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 1px;
  background: var(--rule); border: 1px solid var(--rule); margin-block: 4px;
}
.figures div { background: var(--paper); padding: 8px 10px; display: grid; gap: 2px; }
.figures dt { font: 500 0.72rem var(--f-label); letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-3); }
.figures dd { margin: 0; font: 500 1.05rem var(--f-mono); font-variant-numeric: tabular-nums; }

.card--rail { grid-template-columns: auto 1fr; column-gap: 14px; }
.card--rail > * { grid-column: 2; }
.card--rail .rank {
  grid-column: 1; grid-row: 1 / span 4; font: 600 2rem/1 var(--f-display); color: var(--ink-3);
  font-variant-numeric: lining-nums; min-width: 1.2ch;
}
.card--compact .card__headline { font-size: 1.12rem; }

/* ---------- Front page ---------- */
.front { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 0 32px; }
.front__lead { grid-column: span 7; padding-right: 32px; border-right: 1px solid var(--rule); }
.front__rail { grid-column: span 5; display: grid; align-content: start; }
.front__rail .card { padding-block: 14px; border-bottom: 1px solid var(--rule); }
.front__rail .card:first-child { padding-top: 0; }
.front__rail .card:last-child { border-bottom: 0; }

/* ---------- Section grids ---------- */
.grid3 { display: grid; grid-template-columns: repeat(var(--cols, 3), minmax(0, 1fr)); gap: 24px 32px; }
.grid3 > .card { padding-right: 32px; border-right: 1px solid var(--rule); }
.grid3 > .card:nth-child(3n), .grid3 > .card:last-child { border-right: 0; padding-right: 0; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 32px; }
.empty { color: var(--ink-3); font-style: italic; }

/* Analyst's Corner: set apart on a tinted ground */
.corner { background: var(--surface); padding: clamp(18px, 3vw, 32px); }
.corner .band__head { margin-top: 0; }
.corner .card__headline { font-size: var(--step-2); font-style: italic; font-weight: 600; }
.corner .card__byline { font: 500 0.85rem var(--f-label); color: var(--ink-2); }

/* Learn Something New */
.learn { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 32px; }
.learn .card__headline { font-size: var(--step-3); }
.takeaways { border: 1px solid var(--ink); padding: 18px 20px; align-self: start; }
.takeaways h3 { font: 600 0.8rem var(--f-label); letter-spacing: 0.1em; text-transform: uppercase; margin-bottom: 10px; }
.takeaways ol { margin: 0; padding-left: 1.3em; display: grid; gap: 8px; }

/* Watchlist table */
.table-scroll { overflow-x: auto; }
.watch { width: 100%; border-collapse: collapse; font-family: var(--f-label); font-size: 0.95rem; min-width: 640px; }
.watch th {
  text-align: left; font-weight: 600; font-size: 0.74rem; letter-spacing: 0.09em; text-transform: uppercase;
  color: var(--ink-3); border-bottom: 1px solid var(--ink); padding: 6px 10px 6px 0;
}
.watch td { border-bottom: 1px solid var(--rule); padding: 10px 10px 10px 0; vertical-align: top; }
.watch td.time { font-family: var(--f-mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
.watch .w-title { font-family: var(--f-body); font-weight: 600; font-size: 1rem; }
.watch .w-desc { color: var(--ink-2); font-size: 0.88rem; margin-top: 2px; }
.imp { display: inline-flex; gap: 3px; vertical-align: middle; }
.imp i { width: 7px; height: 12px; background: var(--rule); display: block; }
.imp[data-level="medium"] i:nth-child(-n+2), .imp[data-level="high"] i, .imp[data-level="low"] i:first-child { background: var(--ink); }

/* ---------- Article page ---------- */
.article { max-width: 760px; margin-inline: auto; padding-top: 28px; }
.crumbs { font-family: var(--f-label); font-size: 0.88rem; color: var(--ink-3); display: flex; gap: 6px; flex-wrap: wrap; }
.crumbs a { color: var(--accent); }
.article__head { display: grid; gap: 14px; padding-block: 18px 20px; border-bottom: 1px solid var(--ink); }
.article__head h1 { font-family: var(--f-display); font-size: var(--step-4); line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; }
.article__dek { font-size: var(--step-1); font-style: italic; color: var(--ink-2); line-height: 1.4; }
.article__meta { display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center; font-family: var(--f-label); font-size: 0.9rem; color: var(--ink-2); }
.article__summary { font-size: var(--step-1); line-height: 1.5; padding-block: 20px; border-bottom: 1px solid var(--rule); }
.prose { max-width: var(--measure); display: grid; gap: 1.05em; padding-block: 24px; font-size: 1.14rem; line-height: 1.68; }
.prose h2 { font-family: var(--f-display); font-size: var(--step-2); margin-top: 0.6em; line-height: 1.2; }
.prose blockquote {
  margin: 0.4em 0; padding-left: 20px; border-left: 3px solid var(--accent);
  font-size: var(--step-1); font-style: italic; line-height: 1.45;
}
.prose blockquote cite { display: block; margin-top: 6px; font: normal 0.85rem var(--f-label); color: var(--ink-3); }
.prose ul, .prose ol { margin: 0; padding-left: 1.3em; display: grid; gap: 0.4em; }
.callout { border-top: 3px solid var(--ink); padding-top: 14px; margin-top: 8px; display: grid; gap: 10px; }
.callout h2 { font: 600 0.82rem var(--f-label); letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
.callout p { font-size: 1.12rem; line-height: 1.6; }
.implications { display: grid; gap: 0; margin: 0; }
.implications div { display: grid; grid-template-columns: minmax(0, 11rem) minmax(0, 1fr); gap: 16px; padding-block: 10px; border-bottom: 1px solid var(--rule); }
.implications dt { font: 600 0.9rem var(--f-label); }
.implications dd { margin: 0; }
.sourcebox {
  margin-top: 28px; padding: 16px 18px; border: 1px solid var(--rule); display: grid; gap: 8px;
  font-family: var(--f-label); font-size: 0.93rem;
}
.sourcebox h2 { font: 600 0.78rem var(--f-label); letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
.sourcebox a { color: var(--accent); text-decoration: underline; text-underline-offset: 3px; word-break: break-word; }
.sourcebox dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; }
.sourcebox dt { color: var(--ink-3); }
.sourcebox dd { margin: 0; min-width: 0; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 18px; }
.tags a { font: 500 0.8rem var(--f-label); border: 1px solid var(--rule); padding: 3px 8px; }
.actions { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 18px; }
.btn {
  font: 500 0.85rem var(--f-label); letter-spacing: 0.04em; border: 1px solid var(--ink); background: transparent;
  color: var(--ink); padding: 8px 14px; cursor: pointer;
}
.btn:hover { background: var(--ink); color: var(--paper); }
.related { margin-top: 40px; }

/* ---------- Archive & search ---------- */
.page-head { padding-top: 28px; display: grid; gap: 6px; }
.page-head h1 { font-family: var(--f-display); font-size: var(--step-4); line-height: 1.05; }
.page-head p { color: var(--ink-2); }
.archive-month { margin-top: 28px; }
.archive-month h2 { font: 600 0.85rem var(--f-label); letter-spacing: 0.1em; text-transform: uppercase; border-bottom: 1px solid var(--ink); padding-bottom: 6px; }
.archive-row {
  display: grid; grid-template-columns: 6.5rem minmax(0, 1fr) auto; gap: 16px; align-items: baseline;
  padding-block: 14px; border-bottom: 1px solid var(--rule);
}
.archive-row .no { font-family: var(--f-mono); font-size: 0.85rem; color: var(--ink-3); }
.archive-row h3 { font-family: var(--f-display); font-size: 1.2rem; }
.archive-row .sub { font-family: var(--f-label); font-size: 0.85rem; color: var(--ink-3); margin-top: 2px; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-top: 14px; font-family: var(--f-label); }
.filters select {
  font: 0.9rem var(--f-label); padding: 6px 8px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink);
}
.results { display: grid; gap: 0; margin-top: 18px; }
.results .card { padding-block: 16px; border-bottom: 1px solid var(--rule); }
mark { background: var(--accent-soft); color: inherit; padding: 0 1px; }

/* ---------- Footer ---------- */
.footer { border-top: 3px double var(--ink); padding-block: 22px 40px; margin-top: 48px; font-family: var(--f-label); font-size: 0.88rem; color: var(--ink-2); display: grid; gap: 8px; }
.footer strong { font-family: var(--f-display); font-size: 1.2rem; color: var(--ink); }
.loading { padding-block: 60px; text-align: center; color: var(--ink-3); font-style: italic; }

/* ---------- Responsive ---------- */
@media (max-width: 1024px) {
  .front__lead { grid-column: 1 / -1; padding-right: 0; border-right: 0; border-bottom: 1px solid var(--rule); padding-bottom: 22px; margin-bottom: 18px; }
  .front__rail { grid-column: 1 / -1; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 32px; }
  .front__rail .card { padding-top: 14px; }
  .front__rail .card:nth-last-child(2) { border-bottom: 0; }
  .grid3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid3 > .card { border-right: 0; padding-right: 0; }
  .search input { width: 9rem; }
}
@media (max-width: 720px) {
  .navbar { flex-wrap: wrap; }
  .sections-nav { flex-wrap: nowrap; overflow-x: auto; width: 100%; flex-basis: 100%; scrollbar-width: none; }
  .search { flex: 1; }
  .search input { width: 100%; }
  .front__rail, .grid3, .grid2, .learn { grid-template-columns: minmax(0, 1fr); }
  .front__rail .card:nth-last-child(2) { border-bottom: 1px solid var(--rule); }
  .grid3 > .card { border-bottom: 1px solid var(--rule); padding-bottom: 20px; }
  .grid3 > .card:last-child { border-bottom: 0; }
  .implications div { grid-template-columns: minmax(0, 1fr); gap: 2px; }
  .archive-row { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .dateline { justify-content: center; }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; transition: none !important; } }

/* ---------- Print: article pages print as a clean single column ---------- */
@media print {
  :root { --paper: #fff; --ink: #000; --ink-2: #222; --ink-3: #444; --rule: #999; --accent: #000; --surface: #fff; --demo: #000; --demo-soft: #fff; }
  body { font-size: 11.5pt; background: #fff; }
  .navbar, .actions, .related, .theme-toggle, .tagline, .footer nav, .skip, .tags { display: none !important; }
  .masthead { padding: 0; }
  .nameplate { padding-block: 0 6pt; }
  .nameplate h1 { font-size: 22pt; }
  .dateline { border-bottom: 1pt solid #000; }
  .article { max-width: none; padding-top: 8pt; }
  .article__head h1 { font-size: 24pt; }
  .prose { max-width: none; font-size: 11.5pt; }
  .prose a[href^="http"]::after, .sourcebox a::after { content: " (" attr(href) ")"; font-size: 9pt; }
  .callout, .sourcebox, .prose h2 { break-inside: avoid; }
  .notice { border: 1pt solid #000; }
  a { text-decoration: none; }
}

</style>
</head>
<body>
  <a class="skip" href="#main">Skip to stories</a>
  <header class="masthead" id="masthead"></header>
  <main id="main" tabindex="-1"><p class="loading">Loading today's edition…</p></main>

ure.", "articles": [{"id": "2026-10-11-deals-01", "section": "deals", "category": "M&A", "front_page_rank": 1, "headline": "Kestrel Industries agrees to buy Coromandel Logistics in ₹18,500 crore cash-and-stock deal", "dek": "The fictional conglomerate pays a 27% premium to build a port-to-warehouse network ahead of a freight upswing.", "summary": "Kestrel Industries, a fictional diversified group, will acquire listed freight operator Coromandel Logistics for about ₹18,500 crore, paying 60% in cash and 40% in new Kestrel shares. The board expects the deal to add to earnings per share in the second full year.", "body": ["Kestrel Industries said it had signed a definitive agreement to acquire Coromandel Logistics, a listed operator of inland container depots and warehousing parks, in a transaction that values the target's equity at roughly ₹18,500 crore.", "Shareholders of Coromandel will receive ₹412 in cash and 0.18 Kestrel shares for each share they hold. The offer represents a 27% premium to Coromandel's 30-day volume-weighted average price, according to the company's presentation.", {"type": "h2", "text": "How the deal is financed"}, "The cash portion will be funded through a mix of internal accruals and a ₹6,000 crore acquisition loan arranged by a syndicate of three banks. Kestrel said its net debt to EBITDA ratio would peak at 2.6 times and fall below 2 times within 24 months.", "Management identified ₹900 crore of annual cost synergies, mostly from consolidating warehouse leases and rerouting rail freight, and a further ₹450 crore of revenue synergies from cross-selling cold-chain capacity to Kestrel's food-processing customers.", {"type": "quote", "text": "We are buying network density at a point in the cycle when freight volumes are about to turn.", "cite": "Kestrel chief executive (fictional)"}, "The transaction requires approval from the competition regulator, the stock exchanges and Coromandel's shareholders. An open offer for an additional 26% stake will 7", "section": "tech", "category": "IT services", "front_page_rank": null, "headline": "Lotus Systems signs AI-led outsourcing deal worth $650 million", "dek": "The fictional IT company will use AI agents to run back-office operations for a European insurer.", "summary": "Lotus Systems, a fictional IT services company, has signed a seven-year contract under which pricing is linked to outcomes such as claims processed rather than staff hours.", "body": ["The contract covers claims handling, policy administration and IT support. Lotus expects to deliver the work with about 40% fewer people than a traditional contract.", "Outcome-based pricing shifts productivity gains from the client to the vendor, but it also moves delivery risk onto the vendor."], "why_it_matters": "AI is changing how IT services contracts are priced. Outcome-based deals can lift margins but make revenue less predictable.", "implications": [{"label": "For the sector", "text": "Headcount-led revenue models face pressure as clients ask for AI-driven savings."}, {"label": "For investors", "text": "Watch deal margins and the share of outcome-priced revenue."}], "author": "Demo Desk", "published_at": "2026-10-11T00:10:00+05:30", "updated_at": null, "source": {"name": "Demonstration Source (fictional)", "url": "https://example.com/demo/2026-10-11/tech-17", "published_at": "2026-10-11T00:10:00+05:30", "type": "demo"}, "verification": {"status": "demo", "checked_by": null, "checked_at": null, "notes": "Fictional demonstration story. Companies, figures and events are invented to show the layout."}, "tags": ["AI", "IT services", "outsourcing"], "is_demo": true, "pipeline": {"feed_id": null, "ingested_at": null, "summarised_by": null, "summary_model": null}}, {"id": "2026-10-11-climate-18", "section": "climate", "category": "Green bonds", "front_page_rank": null, "headline": "Aravali Power prices $500 million green bond at a tight spread", "dek": "The fictional utility's five-year bond was three times oversubscribed.", "summary": "Aravali Power, a fictional renewable energy producer, has raised $500 million through a five-year green bond priced at 165 basis points over US Treasuries.", "body": ["Proceeds will fund 1.8 gigawatts of solar and wind capacity with battery storage. Orders exceeded $1.5 billion, mostly from Asian and European funds.", "The company said the bond follows its green financing framework, which has been reviewed by an independent second-party opinion provider."], "why_it_matters": "Strong demand for labelled bonds can lower the cost of capital for renewable developers, which matters because their projects are capital-intensive.", "implications": [{"label": "For issuers", "text": "A 'greenium', or pricing benefit for green bonds, is small but can be meaningful in large issues."}, {"label": "For investors", "text": "Use-of-proceeds reporting is the main safeguard against greenwashing."}], "author": "Demo Desk", "published_at": "2026-10-11T00:20:00+05:30", "updated_at": null, "source": {"name": "Demonstration Source (fictional)", "url": "https://example.com/demo/2026-10-11/climate-18", "published_at": "2026-10-11T00:20:00+05:30", "type": "demo"}, "verification": {"status": "demo", "checked_by": null, "checked_at": null, "notes": "Fictional demonstration story. Companies, figures and events are invented to show the layout."}, "tags": ["green bonds", "renewables"], "is_demo": true, "pipeline": {"feed_id": null, "ingested_at": null, "summarised_by": null, "summary_model": null}}, {"id": "2026-10-11-climate-19", "section": "climate", "category": "Carbon markets", "front_page_rank": null, "headline": "Draft carbon market rules draw pushback over baseline methods", "dek": "Illustrative consultation: steel and cement makers seek longer transition periods.", "summary": "In this fictional consultation, industry groups have asked regulators to revise how emissions-intensity baselines are set under a proposed domestic carbon-credit trading scheme.", "body": ["Steel and cement producers argued that using a single recent year as a baseline would penalise plants that had already invested in efficiency.", "Regulators are expected to publish final rules after reviewing comments. Trading is due to start with a pilot phase covering energy-intensive sectors."], "why_it_matters": "A carbon price creates a new cost line for heavy industry, and baseline rules decide who pays and who earns credits.", "implications": [{"label": "For heavy industry", "text": "Efficient plants could earn tradable credits; laggards may need to buy them."}, {"label": "For valuation", "text": "Analysts may start modelling carbon costs in earnings forecasts."}], "author": "Demo Desk", "published_at": "2026-10-11T00:30:00+05:30", "updated_at": null, "source": {"name": "Demonstration Source (fictional)", "url": "https://example.com/demo/2026-10-11/climate-19", "published_at": "2026-10-11T00:30:00+05:30", "type": "demo"}, "verification": {"status": "demo", "checked_by": null, "checked_at": null, "notes": "Fictional demonstration story. Companies, figures and events are invented to show the layout."}, "tags": ["carbon market", "steel", "cement"], "is_demo": true, "pipeline": {"feed_id": null, "ingested_at": null, "summarised_by": null, "summary_model": null}}, {"id": "2026-10-11-analysis-20", "section": "analysis", "category": "Analysis", "front_page_rank": null, "headline": "Why cash-and-stock deals are back in Indian M&A", "dek": "High acquirer valuations, cautious lenders and tax rules all point the same way. Here is how to read the trend.", "summary": "Mixed consideration lets acquirers use richly valued shares as currency while keeping leverage in check. It also leaves target shareholders exposed to the combined company's performance. This demo analysis walks through the trade-offs.", "body": ["Large Indian acquisitions were long dominated by all-cash offers. Cash is certain for sellers and avoids diluting the buyer's shareholders. The fictional Kestrel–Coromandel transaction on today's front page is a useful case study in why that is changing.", {"type": "h2", "text": "Expensive shares are a strong currency"}, "When an acquirer trades at a higher price-to-earnings multiple than its target, issuing shares to pay for the target can increase earnings per share even before synergies. The arithmetic is simple: the buyer gives up less earnings power per rupee of shares issued than it gains from the target's profits.", "Many listed Indian companies now trade at multiples well above their own history. That makes stock a cheaper form of payment than it was five years ago.", {"type": "h2", "text": "Lenders and rating agencies set the limit"}, "Acquisition debt is available, but rating agencies watch leverage closely. Paying partly in stock keeps net debt to EBITDA within the range that protects a credit rating, which in turn keeps borrowing costs down across the group.", {"type": "h2", "text": "What sellers give up"}, "Target shareholders who receive stock take on the risk that the combined company underperforms. That is why stock-heavy offers usually need a higher headline premium, and why the exchange ratio, collars and lock-ups get so much attention in negotiations.", {"type": "list", "items": ["Check the exchange ratio against both companies' historical trading ranges.", "Look for a collar that protects sellers if the acquirer's share price falls before closing.", "Compare the dilution in year one with the synergy timeline."]}, "The pattern to watch is whether mixed deals continue once acquirer valuations normalise. If they do, it suggests a structural shift in how Indian boards think about capital, not just a response to high share prices."], "why_it_matters": "Deal structure decides who carries the risk after closing. Understanding it helps you judge whether a premium is real value or paid in an inflated currency.", "implications": [{"label": "For analysts", "text": "Model accretion/dilution under different share-price scenarios, not just the announcement-day price."}, {"label": "For target boards", "text": "Stock consideration needs scrutiny of the acquirer's valuation as well as the target's."}, {"label": "For bankers", "text": "Structuring advice, including collars and earn-outs, becomes a bigger part of the mandate."}], "author": "The Analyst's Corner (demo)", "published_at": "2026-10-11T01:00:00+05:30", "updated_at": null, "source": {"name": "Demonstration Source (fictional)", "url": "https://example.com/demo/2026-10-11/analysis-20", "published_at": "2026-10-11T01:00:00+05:30", "type": "demo"}, "verification": {"status": "demo", "checked_by": null, "checked_at": null, "notes": "Fictional demonstration story. Companies, figures and events are invented to show the layout."}, "tags": ["M&A", "deal structure", "valuation"], "is_demo": true, "pipeline": {"feed_id": null, "ingested_at": null, "summarised_by": null, "summary_model": null}}, {"id": "2026-10-11-analysis-21", "section": "analysis", "category": "Analysis", "front_page_rank": null, "headline": "What a long pause in rate cuts means for bank margins", "dek": "Liquidity easing without a rate cut can squeeze lenders in ways the headline rate does not show.", "summary": "When a central bank eases through liquidity, loan rates linked to external benchmarks can fall faster than deposit rates. This demo analysis explains how that affects net interest margins at different kinds of banks.", "body": ["Most new floating-rate retail and small-business loans in India are linked to external benchmarks, so their rates change quickly when market rates move. Deposits reprice slowly because most are fixed-term.", {"type": "h2", "text": "Who is most exposed"}, "Banks with a high share of benchmark-linked loans and a low share of current and savings account deposits feel the squeeze first. Lenders with large low-cost deposit franchises are better protected.", "Over time, deposit rates catch up and margins recover. The question for investors is how long the gap lasts and whether loan growth makes up for thinner spreads."], "why_it_matters": "Bank margins drive the earnings of the largest sector in Indian equity indices, so monetary policy decisions feed quickly into market performance.", "implications": [{"label": "For bank investors", "text": "Track the share of externally benchmarked loans and the CASA ratio."}, {"label": "For borrowers", "text": "Floating-rate borrowers benefit sooner than depositors lose."}], "author": "The Analyst's Corner (demo)", "published_at": "2026-10-11T01:15:00+05:30", "updated_at": null, "source": {"name": "Demonstration Source (fictional)", "url": "https://example.com/demo/2026-10-11/analysis-21", "published_at": "2026-10-11T01:15:00+05:30", "type": "demo"}, "verification": {"status": "demo", "checked_by": null, "checked_at": null, "notes": "Fictional demonstration story. Companies, figures and events are invented to show the layout."}, "tags": ["banks", "interest rates", "NIM"], "is_demo": true, "pipeline": {"feed_id": null, "ingested_at": null, "summarised_by": null, "summary_model": null}}, {"id": "2026-10-11-learn-22", "section": "learn", "category": "Concept", "front_page_rank": null, "headline": "Accretion and dilution: how an acquirer tests whether a deal pays", "dek": "A step-by-step guide to the first analysis every M&A banker runs.", "summary": "Accretion/dilution analysis asks a simple question: after the deal, will the buyer's earnings per share be higher or lower than without it? This explainer shows how to calculate it and what it leaves out.", "body": ["An acquisition is accretive if the combined company's earnings per share (EPS) are higher than the acquirer's standalone EPS. It is dilutive if they are lower.", {"type": "h2", "text": "The basic calculation"}, {"type": "list", "items": ["Start with the acquirer's net income and the target's net income.", "Add after-tax synergies.", "Subtract the after-tax interest on any new debt and the interest income lost on cash used.", "Divide by the acquirer's share count plus any new shares issued.", "Compare the result with the acquirer's standalone EPS."]}, {"type": "h2", "text": "A quick rule of thumb"}, "In an all-stock deal, the transaction is accretive before synergies if the acquirer's P/E multiple is higher than the P/E it is paying for the target. In a debt-funded deal, compare the after-tax cost of debt with the target's earnings yield (the inverse of the P/E paid).", {"type": "h2", "text": "What it does not tell you"}, "EPS accretion is not the same as value creation. A deal can be accretive and still destroy value if the buyer overpays relative to the target's future cash flows, or if the extra debt raises the company's risk. Bankers pair accretion/dilution with discounted cash flow and return-on-capital analysis."], "why_it_matters": "It is the first number boards and investors ask about when a deal is announced, so knowing how it is built helps you read deal presentations critically.", "implications": [{"label": "Try it", "text": "Apply the rule of thumb to the Kestrel–Coromandel example on today's front page."}], "author": "Learn Something New", "published_at": "2026-10-11T01:30:00+05:30", "updated_at": null, "source": {"name": "Demonstration Source (fictional)", "url": "https://example.com/demo/2026-10-11/learn-22", "published_at": "2026-10-11T01:30:00+05:30", "type": "demo"}, "verification": {"status": "evergreen", "checked_by": null, "checked_at": null, "notes": "Educational explainer. The method is standard; the referenced company example is fictional."}, "tags": ["M&A", "valuation", "EPS"], "is_demo": true, "pipeline": {"feed_id": null, "ingested_at": null, "summarised_by": null, "summary_model": null}, "key_takeaways": ["Accretive means pro forma EPS is above standalone EPS.", "All-stock deals: compare the buyer's P/E with the P/E paid.", "Debt-funded deals: compare after-tax cost of debt with the target's earnings yield.", "Accretion is not proof of value crea <script>
/* The Daily Brief — reusable view components.
 * Every component is a pure function: data in, HTML string out.
 * All text from the data files is escaped, so pipeline content can never inject markup.
 */
(function (global) {
  "use strict";

  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

  const safeUrl = (u) => (/^https?:\/\//i.test(String(u || "")) ? esc(u) : "#");

  // Link to the source when it has a real web address; plain text otherwise.
  const SourceLink = (src) => (src && /^https?:\/\//i.test(String(src.url || ""))
    ? `<a href="${esc(src.url)}" target="_blank" rel="noopener noreferrer">${esc(src.name || "Source")}</a>`
    : esc(src?.name || "No external source"));

  let ctx = { site: null, tz: "Asia/Kolkata", locale: "en-IN" };
  function configure(site) {
    ctx = { site, tz: site.timezone || "Asia/Kolkata", locale: site.locale || "en-IN", tzLabel: site.timezone_label || "" };
  }

  function fmtDate(iso, opts) {
    if (!iso) return "";
    const d = new Date(iso.length === 10 ? iso + "T12:00:00+05:30" : iso);
    return new Intl.DateTimeFormat(ctx.locale, { timeZone: ctx.tz, ...opts }).format(d);
  }
  const fmtLong = (iso) => fmtDate(iso, { weekday: "long", day: "numeric", month: "long", year: "numeric" });
  const fmtShort = (iso) => fmtDate(iso, { day: "numeric", month: "short", year: "numeric" });
  const fmtTime = (iso) => fmtDate(iso, { hour: "2-digit", minute: "2-digit", hour12: false }) + (ctx.tzLabel ? " " + ctx.tzLabel : "");
  const fmtStamp = (iso) => `${fmtShort(iso)}, ${fmtTime(iso)}`;

  const sectionOf = (slug) => (ctx.site?.sections || []).find((s) => s.slug === slug) || { slug, name: slug, short: slug };
  const articleHref = (date, id) => `#/edition/${date}/article/${encodeURIComponent(id)}`;
  const sectionHref = (date, slug) => `#/edition/${date}/section/${slug}`;

  function Badge(verification) {
    const status = verification?.status || "unverified";
    const meta = ctx.site?.verification_statuses?.[status] || { label: status, description: "" };
    return `<span class="badge badge--${esc(status)}" title="${esc(meta.description)}">${esc(meta.label)}</span>`;
  }

  function Figures(list) {
    if (!list?.length) return "";
    return `<dl class="figures">${list.map((f) =>
      `<div><dt>${esc(f.label)}</dt><dd>${esc(f.value)}</dd></div>`).join("")}</dl>`;
  }

  /**
   * ArticleCard — the one card used everywhere.
   * variant: "lead" | "rail" | "standard" | "compact" | "analysis" | "result"
   */
  function ArticleCard(a, { date, variant = "standard", rank, highlight, opening = false } = {}) {
    const href = articleHref(date || a.published_at.slice(0, 10), a.id);
    const hl = (s) => (highlight ? highlightText(s, highlight) : esc(s));
    const showWhy = variant !== "compact" && variant !== "result";
    const showSource = variant !== "compact";
    return `
<article class="card card--${variant}">
  ${variant === "rail" && rank ? `<span class="rank" aria-label="Rank ${rank}">${rank}</span>` : ""}
  <div class="card__meta">
    <a class="card__kicker" href="${sectionHref(date, a.section)}">${esc(a.category || sectionOf(a.section).short)}</a>
    ${Badge(a.verification)}
  </div>
  <h3 class="card__headline"><a href="${href}">${hl(a.headline)}</a></h3>
  ${variant === "lead" && a.dek ? `<p class="card__dek">${esc(a.dek)}</p>` : ""}
  ${variant === "analysis" ? `<p class="card__byline">${esc(a.author || "")}</p>` : ""}
  <p class="card__summary">${hl(a.summary)}</p>
  ${variant === "lead" ? Figures(a.key_figures) : ""}
  ${opening ? (a.body || []).filter((b) => typeof b === "string").slice(1, 3).map((p) => `<p class="card__opening">${esc(p)}</p>`).join("") + `<a class="card__more" href="${href}">Continue reading →</a>` : ""}
  ${showWhy && a.why_it_matters ? `<p class="card__why"><b>Why it matters</b>${esc(a.why_it_matters)}</p>` : ""}
  <div class="card__foot">
    <time datetime="${esc(a.published_at)}">${esc(fmtStamp(a.published_at))}</time>
    ${showSource && a.source ? `<span>Source: ${SourceLink(a.source)}</span>` : ""}
    ${variant === "result" ? `<span>${esc(sectionOf(a.section).name)}</span>` : ""}
  </div>
</article>`;
  }

  function highlightText(text, q) {
    const safe = esc(text);
    const terms = q.trim().split(/\s+/).filter((t) => t.length > 1).map((t) => esc(t).replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
    if (!terms.length) return safe;
    return safe.replace(new RegExp(`(${terms.join("|")})`, "gi"), "<mark>$1</mark>");
  }

  function Body(blocks) {
    return (blocks || []).map((b) => {
      if (typeof b === "string") return `<p>${esc(b)}</p>`;
      switch (b.type) {
        case "h2": return `<h2>${esc(b.text)}</h2>`;
        case "quote": return `<blockquote>${esc(b.text)}${b.cite ? `<cite>${esc(b.cite)}</cite>` : ""}</blockquote>`;
        case "list": return `<ul>${(b.items || []).map((i) => `<li>${esc(i)}</li>`).join("")}</ul>`;
        default: return `<p>${esc(b.text)}</p>`;
      }
    }).join("");
  }

  function Implications(list) {
    if (!list?.length) return "";
    return `<dl class="implications">${list.map((i) =>
      typeof i === "string" ? `<div><dt>—</dt><dd>${esc(i)}</dd></div>`
        : `<div><dt>${esc(i.label)}</dt><dd>${esc(i.text)}</dd></div>`).join("")}</dl>`;
  }

  function SourceBox(a) {
    const v = a.verification || {};
    const src = a.source || {};
    return `
<aside class="sourcebox" aria-label="Source and verification">
  <h2>Source &amp; verification</h2>
  <dl>
    <dt>Original source</dt><dd>${SourceLink(src)}</dd>
    <dt>Source published</dt><dd>${src.published_at ? esc(fmtStamp(src.published_at)) : "Not recorded"}</dd>
    <dt>Status</dt><dd>${Badge(v)}${v.checked_at ? ` · checked ${esc(fmtStamp(v.checked_at))}` : ""}${v.checked_by ? ` by ${esc(v.checked_by)}` : ""}</dd>
    ${v.notes ? `<dt>Notes</dt><dd>${esc(v.notes)}</dd>` : ""}
  </dl>
</aside>`;
  }

  function Watchlist(items) {
    if (!items?.length) return `<p class="empty">No scheduled events for tomorrow in this edition.</p>`;
    const order = { high: 0, medium: 1, low: 2 };
    const sorted = [...items].sort((x, y) => (order[x.importance] ?? 3) - (order[y.importance] ?? 3) || String(x.time).localeCompare(String(y.time)));
    return `
<div class="table-scroll">
<table class="watch">
  <thead><tr><th scope="col">Time (${esc(ctx.tzLabel || ctx.tz)})</th><th scope="col">Event</th><th scope="col">Type</th><th scope="col">Region</th><th scope="col">Importance</th><th scope="col">Status</th></tr></thead>
  <tbody>
  ${sorted.map((w) => `
    <tr>
      <td class="time">${esc(w.time || "TBC")}<div class="w-desc">${esc(fmtDate(w.date, { day: "numeric", month: "short" }))}</div></td>
      <td><div class="w-title">${w.source?.url ? `<a href="${safeUrl(w.source.url)}" target="_blank" rel="noopener noreferrer">${esc(w.title)}</a>` : esc(w.title)}</div>
          ${w.description ? `<div class="w-desc">${esc(w.description)}</div>` : ""}</td>
      <td>${esc(w.category)}</td>
      <td>${esc(w.region)}</td>
      <td><span class="imp" data-level="${esc(w.importance)}" aria-label="${esc(w.importance)} importance" title="${esc(w.importance)}"><i></i><i></i><i></i></span></td>
      <td>${Badge(w.verification)}</td>
    </tr>`).join("")}
  </tbody>
</table>
</div>`;
  }

  global.DB = Object.assign(global.DB || {}, {
    components: { ArticleCard, Badge, Body, Implications, SourceBox, Watchlist, Figures },
    util: { SourceLink, esc, safeUrl, fmtDate, fmtLong, fmtShort, fmtTime, fmtStamp, sectionOf, articleHref, sectionHref, highlightText, configure },
  });
})(window);

/* The Daily Brief — data loading, routing and page views.
 *
 * Data flow:  data/site.json  →  data/editions.json (manifest)  →  data/editions/<date>.json
 * Routes (hash-based, so the site runs on any static host):
 *   #/                                 latest published edition
 *   #/edition/2026-10-11               a specific edition
 *   #/edition/<date>/section/<slug>    every story in one section
 *   #/edition/<date>/article/<id>      article page
 *   #/archive                          previous editions
 *   #/search/<query>                   search across all published editions
 */
(function () {
  "use strict";
  const { ArticleCard, Body, Implications, SourceBox, Watchlist } = DB.components;
  const U = DB.util;
  const esc = U.esc;
  const DATA_ROOT = "data";

  /* ---------------- Data store ---------------- */
  // If a build step embedded the data (window.DAILY_BRIEF_BUNDLE), use it; otherwise fetch the JSON files.
  const bundle = window.DAILY_BRIEF_BUNDLE || null;
  const cache = new Map();
  async function getJSON(path) {
    if (cache.has(path)) return cache.get(path);
    const p = bundle
      ? Promise.resolve(bundle[path] ?? Promise.reject(new Error(`Missing ${path} in bundle`)))
      : fetch(`${DATA_ROOT}/${path}`, { cache: "no-cache" }).then((r) => {
          if (!r.ok) throw new Error(`${path}: HTTP ${r.status}`);
          return r.json();
        });
    cache.set(path, p);
    return p;
  }

  // Scheduled publishing: an edition is visible once status is "published",
  // or status is "scheduled" and its publish time has passed. Drafts never show.
  const isLive = (e, now = Date.now()) =>
    (e.status === "published" || e.status === "scheduled") && Date.parse(e.published_at) <= now;

  const Store = {
    site: () => getJSON("site.json"),
    async editions() {
      const m = await getJSON("editions.json");
      return m.editions.filter((e) => isLive(e)).sort((a, b) => b.date.localeCompare(a.date));
    },
    async edition(date) {
      const list = await this.editions();
      const entry = date ? list.find((e) => e.date === date) : list[0];
      if (!entry) return null;
      const ed = await getJSON(entry.path);
      return { ...ed, _entry: entry };
    },
  };

  /* ---------------- Shell ---------------- */
  const $ = (sel) => document.querySelector(sel);
  let SITE = null;
  let currentEdition = null;

  function renderMasthead(ed, activeSlug) {
    const total = ed?.articles?.length || 0;
    const counts = {};
    (ed?.articles || []).forEach((a) => { const s = a.verification?.status || "unverified"; counts[s] = (counts[s] || 0) + 1; });
    const ledger = Object.entries(counts).map(([s, n]) => `${n} ${(SITE.verification_statuses[s]?.label || s).toLowerCase()}`).join(" · ");
    $("#masthead").innerHTML = `
<div class="wrap">
  <div class="dateline label">
    <span>${ed ? esc(U.fmtLong(ed.date)) : ""}</span>
    <span class="mono">${esc(SITE.volume)} · No. ${ed ? esc(ed.edition_number) : "—"}</span>
    <span>${total} stories${ledger ? ` · ${esc(ledger)}` : ""}</span>
  </div>
  <div class="nameplate">
    <a href="#/"><h1>The Daily <em>Brief</em></h1></a>
    <p class="tagline">${esc(SITE.tagline)}</p>
  </div>
  <div class="navbar">
    <nav class="sections-nav" aria-label="Sections">
      <a href="#/" ${!activeSlug ? 'aria-current="page"' : ""}>Front page</a>
      ${SITE.sections.map((s) => `<a href="${U.sectionHref(ed?.date, s.slug)}" ${activeSlug === s.slug ? 'aria-current="page"' : ""}>${esc(s.short)}</a>`).join("")}
      <a href="#/archive" ${activeSlug === "archive" ? 'aria-current="page"' : ""}>Archive</a>
    </nav>
    <form class="search" role="search" id="search-form">
      <label for="q" class="skip">Search stories</label>
      <input id="q" name="q" type="search" placeholder="Search stories" autocomplete="off">
      <button type="submit">Search</button>
    </form>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Switch colour theme">Theme</button>
  </div>
  ${ed?.is_demo ? `<div class="notice" role="note"><strong>Demonstration edition</strong><span>${esc(ed.editor_note || "Stories in this edition are fictional and exist only to demonstrate the layout.")}</span></div>` : ""}
</div>`;
    $("#search-form").addEventListener("submit", (e) => {
      e.preventDefault();
      const q = $("#q").value.trim();
      if (q) location.hash = `#/search/${encodeURIComponent(q)}`;
    });
    $("#theme-toggle").addEventListener("click", toggleTheme);
  }

  function toggleTheme() {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("db-theme", root.dataset.theme); } catch (_) {}
  }
  try { const t = localStorage.getItem("db-theme"); if (t) document.documentElement.dataset.theme = t; } catch (_) {}

  function renderFooter() {
    $("#footer").innerHTML = `
<div class="wrap footer">
  <strong>The Daily Brief</strong>
  <p>A personal digest of finance, markets and policy. Every story links to its original source and carries a verification status. Summaries are not investment advice.</p>
  <nav><a href="#/">Today</a> · <a href="#/archive">Previous editions</a></nav>
</div>`;
  }

  const main = () => $("#main");
  const setTitle = (t) => { document.title = t ? `${t} — The Daily Brief` : "The Daily Brief"; };

  /* ---------------- Views ---------------- */
  function bySection(ed, slug, excludeFront = true) {
    return ed.articles
      .filter((a) => a.section === slug && (!excludeFront || !a.front_page_rank))
      .sort((a, b) => b.published_at.localeCompare(a.published_at));
  }

  function viewHome(ed) {
    const d = ed.date;
    const front = ed.articles.filter((a) => a.front_page_rank).sort((a, b) => a.front_page_rank - b.front_page_rank).slice(0, 5);
    const out = [];
    for (const block of SITE.homepage) {
      if (block.type === "front" && front.length) {
        const [lead, ...rail] = front;
        out.push(`
<section class="band" aria-labelledby="h-front">
  <div class="band__head"><div class="band__title"><h2 id="h-front">${esc(block.title)}</h2><p>The ${front.length} stories that matter most this morning.</p></div></div>
  <div class="front">
    <div class="front__lead">${ArticleCard(lead, { date: d, variant: "lead", opening: true })}</div>
    <div class="front__rail">${rail.map((a, i) => ArticleCard(a, { date: d, variant: "rail", rank: i + 2 })).join("")}</div>
  </div>
</section>`);
      } else if (block.type === "section") {
        const s = U.sectionOf(block.slug);
        const items = bySection(ed, block.slug).slice(0, 3);
        if (!items.length) continue;
        out.push(`
<section class="band" aria-labelledby="h-${s.slug}">
  <div class="band__head">
    <div class="band__title"><h2 id="h-${s.slug}">${esc(s.name)}</h2><p>${esc(s.description)}</p></div>
    <a class="more" href="${U.sectionHref(d, s.slug)}">All ${esc(s.short)} stories →</a>
  </div>
  <div class="grid3" style="--cols:${Math.min(items.length, 3)}">${items.map((a) => ArticleCard(a, { date: d })).join("")}</div>
</section>`);
      } else if (block.type === "analysis") {
        const s = U.sectionOf(block.slug);
        const items = bySection(ed, block.slug, false);
        if (!items.length) continue;
        out.push(`
<section class="band corner" aria-labelledby="h-analysis">
  <div class="band__head"><div class="band__title"><h2 id="h-analysis">${esc(s.name)}</h2><p>${esc(s.description)}</p></div></div>
  <div class="grid2">${items.slice(0, 2).map((a) => ArticleCard(a, { date: d, variant: "analysis" })).join("")}</div>
</section>`);
      } else if (block.type === "learn") {
        const s = U.sectionOf(block.slug);
        const a = bySection(ed, block.slug, false)[0];
        if (!a) continue;
        out.push(`
<section class="band" aria-labelledby="h-learn">
  <div class="band__head"><div class="band__title"><h2 id="h-learn">${esc(s.name)}</h2><p>${esc(s.description)}</p></div></div>
  <div class="learn">
    ${ArticleCard(a, { date: d, variant: "lead" })}
    ${a.key_takeaways?.length ? `<aside class="takeaways"><h3>Key takeaways</h3><ol>${a.key_takeaways.map((t) => `<li>${esc(t)}</li>`).join("")}</ol></aside>` : ""}
  </div>
</section>`);
      } else if (block.type === "watchlist") {
        const nextDay = ed.watchlist?.[0]?.date;
        out.push(`
<section class="band" aria-labelledby="h-watch">
  <div class="band__head"><div class="band__title"><h2 id="h-watch">${esc(block.title)}</h2><p>${nextDay ? `Scheduled for ${esc(U.fmtLong(nextDay))}. Times are ${esc(SITE.timezone_label)}.` : "Economic releases, results and events to watch."}</p></div></div>
  ${Watchlist(ed.watchlist)}
</section>`);
      }
    }
    main().innerHTML = `<div class="wrap">${out.join("")}</div>`;
    setTitle(ed === currentEdition ? "" : `Edition No. ${ed.edition_number}`);
  }

  function viewSection(ed, slug) {
    const s = U.sectionOf(slug);
    const items = bySection(ed, slug, false);
    main().innerHTML = `
<div class="wrap">
  <header class="page-head"><span class="label">${esc(U.fmtLong(ed.date))} · No. ${esc(ed.edition_number)}</span><h1>${esc(s.name)}</h1><p>${esc(s.description || "")}</p></header>
  <div class="results">${items.length ? items.map((a) => ArticleCard(a, { date: ed.date })).join("") : `<p class="empty">No ${esc(s.short)} stories in this edition.</p>`}</div>
</div>`;
    setTitle(s.name);
  }

  function viewArticle(ed, id) {
    const a = ed.articles.find((x) => x.id === id);
    if (!a) return viewNotFound("We couldn't find that story in this edition.");
    const s = U.sectionOf(a.section);
    const related = ed.articles.filter((x) => x.section === a.section && x.id !== a.id).slice(0, 3);
    const canPrint = window.self === window.top; // printing is blocked inside embedded previews
    main().innerHTML = `
<div class="wrap">
<article class="article">
  <nav class="crumbs" aria-label="Breadcrumb"><a href="#/edition/${ed.date}">No. ${esc(ed.edition_number)} · ${esc(U.fmtShort(ed.date))}</a><span>/</span><a href="${U.sectionHref(ed.date, a.section)}">${esc(s.name)}</a></nav>
  ${a.is_demo ? `<div class="notice" role="note"><strong>Demo story</strong><span>This article is fictional. ${esc(a.verification?.notes || "")}</span></div>` : ""}
  <header class="article__head">
    <div class="card__meta"><span class="card__kicker">${esc(a.category)}</span>${DB.components.Badge(a.verification)}</div>
    <h1>${esc(a.headline)}</h1>
    ${a.dek ? `<p class="article__dek">${esc(a.dek)}</p>` : ""}
    <div class="article__meta">
      ${a.author ? `<span>By ${esc(a.author)}</span>` : ""}
      <time datetime="${esc(a.published_at)}">Published ${esc(U.fmtStamp(a.published_at))}</time>
      ${a.updated_at ? `<time datetime="${esc(a.updated_at)}">Updated ${esc(U.fmtStamp(a.updated_at))}</time>` : ""}
      <span>Source: ${U.SourceLink(a.source)}</span>
    </div>
  </header>
  <p class="article__summary">${esc(a.summary)}</p>
  ${a.key_figures?.length ? `<div style="margin-top:20px">${DB.components.Figures(a.key_figures)}</div>` : ""}
  <div class="prose">${Body(a.body)}</div>
  ${a.key_takeaways?.length ? `<aside class="takeaways"><h3>Key takeaways</h3><ol>${a.key_takeaways.map((t) => `<li>${esc(t)}</li>`).join("")}</ol></aside>` : ""}
  <section class="callout" style="margin-top:24px"><h2>Why it matters</h2><p>${esc(a.why_it_matters)}</p></section>
  ${a.implications?.length ? `<section class="callout" style="margin-top:24px"><h2>Business &amp; financial implications</h2>${Implications(a.implications)}</section>` : ""}
  ${SourceBox(a)}
  ${a.tags?.length ? `<div class="tags">${a.tags.map((t) => `<a href="#/search/${encodeURIComponent(t)}">${esc(t)}</a>`).join("")}</div>` : ""}
  <div class="actions">
    ${canPrint ? `<button class="btn" type="button" id="print-btn">Print article</button>` : ""}
    <button class="btn" type="button" id="copy-btn">Copy link</button>
    ${/^https?:\/\//i.test(a.source?.url || "") ? `<a class="btn" href="${esc(a.source.url)}" target="_blank" rel="noopener noreferrer">Read original source</a>` : ""}
  </div>
  ${related.length ? `<section class="related band"><div class="band__head"><h2>More from ${esc(s.name)}</h2></div><div class="grid3" style="--cols:${related.length}">${related.map((r) => ArticleCard(r, { date: ed.date, variant: "compact" })).join("")}</div></section>` : ""}
</article>
</div>`;
    $("#print-btn")?.addEventListener("click", () => window.print());
    $("#copy-btn").addEventListener("click", (e) => {
      const btn = e.currentTarget;
      navigator.clipboard?.writeText(location.href).then(() => { btn.textContent = "Link copied"; }, () => { btn.textContent = "Copy failed"; });
    });
    setTitle(a.headline);
  }

  async function viewArchive() {
    const list = await Store.editions();
    const groups = {};
    list.forEach((e) => { const k = U.fmtDate(e.date, { month: "long", year: "numeric" }); (groups[k] ||= []).push(e); });
    main().innerHTML = `
<div class="wrap">
  <header class="page-head"><span class="label">Archive</span><h1>Previous editions</h1><p>${list.length} published editions. Scheduled and draft editions appear here once their publish time passes.</p></header>
  ${Object.entries(groups).map(([month, eds]) => `
  <section class="archive-month"><h2>${esc(month)}</h2>
    ${eds.map((e) => `
    <a class="archive-row" href="#/edition/${e.date}">
      <span class="no">No. ${esc(e.edition_number)}</span>
      <div><h3>${esc(e.lead_headline || "Edition")}</h3><div class="sub">${esc(U.fmtLong(e.date))} · ${e.article_count} stories</div></div>
      <span>${e.is_demo ? DB.components.Badge({ status: "demo" }) : ""}</span>
    </a>`).join("")}
  </section>`).join("")}
</div>`;
    setTitle("Previous editions");
  }

  async function viewSearch(q, sectionFilter = "") {
    const list = await Store.editions();
    const eds = await Promise.all(list.map((e) => Store.edition(e.date)));
    const terms = q.toLowerCase().split(/\s+/).filter(Boolean);
    const hits = [];
    eds.forEach((ed) => ed.articles.forEach((a) => {
      if (sectionFilter && a.section !== sectionFilter) return;
      const hay = [a.headline, a.dek, a.summary, a.why_it_matters, a.category, (a.tags || []).join(" "), a.source?.name]
        .join(" ").toLowerCase();
      if (terms.every((t) => hay.includes(t))) hits.push({ a, date: ed.date });
    }));
    hits.sort((x, y) => y.a.published_at.localeCompare(x.a.published_at));
    main().innerHTML = `
<div class="wrap">
  <header class="page-head"><span class="label">Search</span><h1>${esc(q)}</h1>
    <div class="filters">
      <label for="section-filter">Section</label>
      <select id="section-filter"><option value="">All sections</option>${SITE.sections.map((s) => `<option value="${s.slug}" ${s.slug === sectionFilter ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
      <span>${hits.length} result${hits.length === 1 ? "" : "s"} across ${eds.length} editions</span>
    </div>
  </header>
  <div class="results">${hits.length ? hits.map((h) => ArticleCard(h.a, { date: h.date, variant: "result", highlight: q })).join("") : `<p class="empty">No stories match “${esc(q)}”. Try a company name, a sector or a term like “IPO”.</p>`}</div>
</div>`;
    $("#section-filter").addEventListener("change", (e) => viewSearch(q, e.target.value));
    $("#q").value = q;
    setTitle(`Search: ${q}`);
  }

  function viewNotFound(msg) {
    main().innerHTML = `<div class="wrap"><header class="page-head"><h1>Not found</h1><p>${esc(msg)}</p><p><a href="#/" style="color:var(--accent)">Go to today's front page →</a></p></header></div>`;
    setTitle("Not found");
  }

  /* ---------------- Router ---------------- */
  async function route() {
    const parts = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean).map(decodeURIComponent);
    try {
      if (parts[0] === "archive") { renderMasthead(currentEdition, "archive"); await viewArchive(); }
      else if (parts[0] === "search") { renderMasthead(currentEdition); await viewSearch(parts.slice(1).join("/")); }
      else {
        const date = parts[0] === "edition" ? parts[1] : null;
        const ed = date ? await Store.edition(date) : currentEdition;
        if (!ed) { renderMasthead(currentEdition); return viewNotFound(`There is no published edition for ${date}.`); }
        if (parts[2] === "article") { renderMasthead(ed, ed.articles.find((a) => a.id === parts[3])?.section); viewArticle(ed, parts[3]); }
        else if (parts[2] === "section") { renderMasthead(ed, parts[3]); viewSection(ed, parts[3]); }
        else { renderMasthead(ed); viewHome(ed); }
      }
    } catch (err) {
      console.error(err);
      main().innerHTML = `<div class="wrap"><header class="page-head"><h1>Couldn't load this page</h1><p>${esc(err.message)}. If you opened index.html directly from disk, serve the folder instead: <code>python3 -m http.server</code>.</p></header></div>`;
    }
    window.scrollTo(0, 0);
  }

  async function start() {
    try {
      SITE = await Store.site();
      U.configure(SITE);
      currentEdition = await Store.edition(null);
      renderFooter();
      window.addEventListener("hashchange", route);
      await route();
    } catch (err) {
      console.error(err);
      main().innerHTML = `<div class="wrap"><header class="page-head"><h1>Couldn't load the newspaper</h1><p>${esc(err.message)}. Serve this folder over HTTP (for example <code>python3 -m http.server 8000</code>) rather than opening the file directly.</p></header></div>`;
    }
  }
  start();
})();

</script>
</body>
</html>
